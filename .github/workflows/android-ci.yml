name: SMC Lab Signed Release Build & CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Prepare Signing Keystore (Debug + Release Upload Key)
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -genkeypair -v \
            -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.STORE_PASSWORD || 'smclab2026' }}" \
            -keypass "${{ secrets.KEY_PASSWORD || 'smclab2026' }}" \
            -dname "CN=SMC Lab, OU=Mobile, O=SMC Lab, L=Riyadh, S=Riyadh, C=SA"

      - name: Run Full Unit & Robolectric Test Suite (Phases 0-6)
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Signed Commercial Release APK & AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'smclab2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'smclab2026' }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Copy Signed Release Artifacts
        run: |
          mkdir -p dist-release
          cp app/build/outputs/apk/release/app-release.apk dist-release/SMC_Lab_v1.0.0_release_signed.apk
          cp app/build/outputs/bundle/release/app-release.aab dist-release/SMC_Lab_v1.0.0_release_signed.aab
          sha256sum dist-release/* > dist-release/SHA256SUMS.txt

      - name: Upload Signed Release APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SMC-Lab-Signed-Release-v1.0.0
          path: dist-release/*
          if-no-files-found: error
